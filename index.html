<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio Mock</title>
  <style>
    :root{
      --ink:#111;
      --muted:#444;
      --navy:#24344d;
      --max:1200px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--ink);
      background:#fff;
    }

    /* NAV */
    .nav{
      max-width:var(--max);
      margin:0 auto;
      padding:18px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .nav-left, .nav-right{display:flex; align-items:center; gap:28px;}
    .nav a{
      text-decoration:none;
      color:#111;
      font-weight:600;
      font-size:15px;
      padding:6px 2px;
    }
    .nav a.active{ text-decoration: underline; text-underline-offset: 6px; }
    .brand{
      font-weight:800;
      letter-spacing:.2px;
      font-size:18px;
      white-space:nowrap;
    }
    .icon{
      width:22px; height:22px;
      display:inline-block;
      vertical-align:middle;
      opacity:.9;
    }

    /* HERO */
    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:40px 22px 60px;
    }
    .hero{
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap:54px;
      align-items:center;
      min-height:72vh;
    }

    /* Always-visible portrait placeholder (no external image) */
    .photo{
      width:100%;
      aspect-ratio: 1 / 1;
      border-radius:28px;
      overflow:hidden;
      background:
        radial-gradient(circle at 30% 25%, #f0f0f0 0 35%, transparent 36%),
        radial-gradient(circle at 60% 35%, #e9e9e9 0 30%, transparent 31%),
        linear-gradient(135deg, #f7f7f7, #eaeaea);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      position:relative;
    }
    .photo::after{
      content:"TEMP PORTRAIT";
      position:absolute;
      inset:auto 0 22px 0;
      text-align:center;
      font-weight:800;
      letter-spacing:2px;
      color:#777;
      font-size:12px;
    }

    .right{
      position:relative;
      text-align:center;
      padding:10px 12px;
    }
    .headline{
      font-size: clamp(34px, 4.2vw, 56px);
      line-height:1.05;
      margin:0 0 18px;
      font-weight:900;
      letter-spacing:-.8px;
    }
    .sub{
      margin:0 auto 18px;
      max-width: 42ch;
      color:var(--muted);
      font-size:16px;
      line-height:1.6;
    }
    .cta{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
      margin-top:18px;
    }
    .btn{
      width: 260px;
      border:none;
      background:var(--navy);
      color:#fff;
      font-weight:800;
      letter-spacing:.8px;
      padding:12px 14px;
      border-radius:10px;
      cursor:pointer;
      text-transform:uppercase;
    }
    .btn:active{transform:translateY(1px)}
    .btn.alt{ background:#1f2d44; opacity:.95; }

    /* Inline “sketch” placeholders (always show) */
    .sketch{
      position:absolute;
      opacity:.25;
      pointer-events:none;
      user-select:none;
      filter: grayscale(1) contrast(1.2);
    }
    .sk1{ top:-10px; right:-10px; width:140px; transform:rotate(6deg); }
    .sk2{ bottom:-20px; left:-20px; width:180px; transform:rotate(-8deg); }
    .sk3{ bottom:-10px; right:-20px; width:170px; transform:rotate(10deg); }

    @media (max-width: 900px){
      .hero{ grid-template-columns:1fr; gap:26px; min-height:auto; }
      .sketch{display:none;}
      .brand{display:none;}
      .nav-left{gap:18px}
    }
  </style>
</head>
<body>

    <nav class="nav-left">
      <a class="active" href="#home">Home</a>
      <a href="#resume">Resume</a>
      <a href="#projects">Projects</a>
    </nav>

    <div class="brand">Your Name’s Portfolio</div>

    <div class="nav-right">
      <a href="#" title="LinkedIn" aria-label="LinkedIn">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

        </svg>
      </a>
    </div>
  </header>

          <path d="M30 130 L10 160 L210 160 L190 130" stroke="#000" stroke-width="4" fill="none"/>
        </svg>
        <svg class="sketch sk3" viewBox="0 0 240 200" aria-hidden="true">
          <path
